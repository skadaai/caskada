name: Check for Changesets

on:
  pull_request:
    branches:
      - '*'
    paths:
      - 'python/**'
      - 'typescript/**'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check for missing changesets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: true

      # Need to determine which paths were changed to conditionally run the checks
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            python:
              - 'python/**'
            typescript:
              - 'typescript/**'

      - name: Prepare Python package to use Changesets
        if: steps.filter.outputs.python == 'true'
        working-directory: python
        run: |
          echo "Initializing pnpm project..."
          touch pnpm-workspace.yaml
          pnpm init
          CURRENT_VERSION=$(grep "version=['\"]" setup.py | cut -d "'" -f 2 | cut -d '"' -f 2)
          pnpm pkg set name=caskada
          pnpm pkg set "version=$CURRENT_VERSION"
          echo "Checking .changeset:"
          ls -la .changeset

      - name: Prepare TypeScript package to use Changesets
        if: steps.filter.outputs.typescript == 'true'
        working-directory: typescript
        run: touch pnpm-workspace.yaml

      - name: Check for Python changesets
        if: steps.filter.outputs.python == 'true'
        id: python-check
        working-directory: python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if pnpm dlx @changesets/cli@2.31.1 status --since="$BASE_SHA"; then
            echo "has_changeset=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changeset=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for TypeScript changesets
        if: steps.filter.outputs.typescript == 'true'
        id: typescript-check
        working-directory: typescript
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if pnpm dlx @changesets/cli@2.31.1 status --since="$BASE_SHA"; then
            echo "has_changeset=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changeset=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find existing Python comment
        if: steps.filter.outputs.python == 'true'
        uses: peter-evans/find-comment@v4.0.0
        id: find-python-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Python Changeset

      - name: Find existing TypeScript comment
        if: steps.filter.outputs.typescript == 'true'
        uses: peter-evans/find-comment@v4.0.0
        id: find-typescript-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: TypeScript Changeset

      - name: Update Python changeset status comment
        if: steps.filter.outputs.python == 'true'
        uses: actions/github-script@v9.0.0
        env:
          HAS_CHANGESET: ${{ steps.python-check.outputs.has_changeset }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tools = await import('${{ github.workspace }}/.github/scripts/generate-changeset-comment.js');

            const hasChangeset = process.env.HAS_CHANGESET === 'true';
            const commentBody = tools.generateChangesetComment(context, 'Python', hasChangeset);

            // Assign commentId as a string to handle cases where find-comment returns empty
            const commentId = '${{ steps.find-python-comment.outputs.comment-id }}';

            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody
              });
            }

      - name: Update TypeScript changeset status comment
        if: steps.filter.outputs.typescript == 'true'
        uses: actions/github-script@v9.0.0
        env:
          HAS_CHANGESET: ${{ steps.typescript-check.outputs.has_changeset }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tools = await import('${{ github.workspace }}/.github/scripts/generate-changeset-comment.js');

            const hasChangeset = process.env.HAS_CHANGESET === 'true';
            const commentBody = tools.generateChangesetComment(context, 'TypeScript', hasChangeset);

            // Assign commentId as a string to handle cases where find-comment returns empty
            const commentId = '${{ steps.find-typescript-comment.outputs.comment-id }}';

            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody
              });
            }

      - name: Fail if changesets are missing
        if: (steps.filter.outputs.python == 'true' && steps.python-check.outputs.has_changeset == 'false') || (steps.filter.outputs.typescript == 'true' && steps.typescript-check.outputs.has_changeset == 'false')
        run: |
          echo "❌ Missing changesets detected. Please add changesets to document your changes."
          exit 1
