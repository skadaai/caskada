name: Publish TypeScript Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'typescript/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Required to push tags and commit version updates
      id-token: write        # Required for npm Trusted Publishing (OIDC)
    environment: npm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (Trusted Publishing requires npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false

      - name: Install Dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        working-directory: typescript
        run: |
          node --import=tsx --experimental-test-snapshots --test-concurrency=1 --test tests/*.test.ts

      - name: Get current version
        id: current_version
        working-directory: typescript
        run: |
          CURRENT_VERSION=$(jq -r '.version' package.json)
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Apply Version Updates
        id: version
        working-directory: typescript
        run: |
          # Changesets needs a package-local workspace root. Remove the marker
          # when this step exits so later pnpm commands use the locked root workspace.
          if [ -e pnpm-workspace.yaml ] || [ -L pnpm-workspace.yaml ]; then
            echo "Unexpected existing typescript/pnpm-workspace.yaml." >&2
            exit 1
          fi
          trap 'rm -f pnpm-workspace.yaml' EXIT
          touch pnpm-workspace.yaml

          # Ensure package.json exists
          if [ ! -f "package.json" ]; then
            echo "Missing package.json file."
            exit 1
          fi

          pnpm dlx @changesets/cli@2.31.1 version

          NEW_VERSION=$(jq -r '.version' package.json)
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          if [ "${{ steps.current_version.outputs.current_version }}" == "$NEW_VERSION" ]; then
            echo "No version change detected."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version changed from ${{ steps.current_version.outputs.current_version }} to $NEW_VERSION"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Project
        if: steps.version.outputs.has_changes == 'true'
        working-directory: typescript
        run: pnpm build

      - name: Publish to npm (OIDC)
        if: steps.version.outputs.has_changes == 'true'
        working-directory: typescript
        run: npm publish

      - name: Commit and push version bump
        if: steps.version.outputs.has_changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: 'chore: update TS version and publish'
          file_pattern: 'typescript/package.json typescript/.changeset/* typescript/CHANGELOG.md'
          # The action defaults to pushing to the branch that triggered the workflow (main)
          # It also uses the github-actions[bot] user by default

      - name: Extract changelog text
        if: steps.version.outputs.has_changes == 'true'
        id: changelog_text
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi
          CHANGELOG_CONTENT=$(node .github/scripts/extract-changelog-text.js typescript "$RELEASE_VERSION")
          # Proper multiline output
          {
            echo 'changelog<<EOF'
            echo "$CHANGELOG_CONTENT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.version.outputs.has_changes == 'true'
        uses: softprops/action-gh-release@v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: typescript-v${{ steps.version.outputs.new_version }}
          name: TypeScript Package v${{ steps.version.outputs.new_version }}
          body: |
            ## Caskada TypeScript Package v${{ steps.version.outputs.new_version }}

            ${{ steps.changelog_text.outputs.changelog }}

            ### Installation

            npm install caskada@${{ steps.version.outputs.new_version }}
            pnpm add caskada@${{ steps.version.outputs.new_version }}
            yarn add caskada@${{ steps.version.outputs.new_version }}

            ### NPM Package

            📦 [View on NPM](https://www.npmjs.com/package/caskada/v/${{ steps.version.outputs.new_version }})
          draft: false
          prerelease: false

      - name: Notify Discord
        if: steps.version.outputs.has_changes == 'true' && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          node .github/scripts/discord-notify.js \
            "$DISCORD_WEBHOOK_URL" \
            "typescript" \
            "${{ steps.version.outputs.new_version }}" \
            "${{ steps.changelog_text.outputs.changelog }}" \
            "${{ github.server_url }}/${{ github.repository }}"
